syntax = "proto3";

package alter.memory.v1;

service MemoryService {
  rpc ProposeWriteback(ProposeWritebackRequest) returns (ProposeWritebackResponse);
  rpc PromoteMemory(PromoteMemoryRequest) returns (PromoteMemoryResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc GetMemorySettings(MemoryWorkspaceRequest) returns (MemorySettingsResponse);
  rpc UpdateMemorySettings(UpdateMemorySettingsRequest) returns (MemorySettingsResponse);
  rpc MemoryAccess(MemoryAccessRequest) returns (MemoryAccessResponse);
  rpc RecallChat(RecallChatRequest) returns (MemoryRecallResponse);
  rpc RecallWorkflow(RecallWorkflowRequest) returns (MemoryRecallResponse);
}

message ProposeWritebackRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string workspace_id = 2; // ws_ prefixed UUIDv7
  string run_id = 3; // run_ prefixed UUIDv7
  string verified_output_artifact_id = 4; // art_ prefixed UUIDv7
  string namespace = 5;
}

message ProposeWritebackResponse {
  reserved 100 to 199;

  string memory_id = 1; // mem_ prefixed UUIDv7
  string candidate_json = 2;
  bool skipped = 3;
}

message PromoteMemoryRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string memory_id = 2; // mem_ prefixed UUIDv7
  string evaluation_run_id = 3; // evr_ prefixed UUIDv7
  // ADS Core scope this memory should be delivered into when its real
  // destination (policy_store/repository.py) is "ads_memory_namespace".
  // The caller supplies this -- memory-service has no way to derive an
  // ADS Core scope_id on its own. Absent means delivery is skipped, not
  // failed: promotion itself never depends on ADS Core being reachable.
  optional string ads_core_scope_id = 4; // scp_ prefixed UUIDv7
}

message PromoteMemoryResponse {
  reserved 100 to 199;

  bool promoted = 1;
  string promoted_at = 2; // ISO 8601 timestamp
}

message UpdatePolicyRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string policy_id = 2; // pol_ prefixed UUIDv7
  string current_version = 3;
  string patch_json = 4;
}

message UpdatePolicyResponse {
  reserved 100 to 199;

  string policy_id = 1; // pol_ prefixed UUIDv7
  string new_version = 2;
}

message MemoryWorkspaceRequest {
  reserved 100 to 199;
  string tenant_id = 1;
  string workspace_id = 2;
}
message UpdateMemorySettingsRequest {
  reserved 100 to 199;
  string tenant_id = 1;
  string workspace_id = 2;
  string actor_id = 3;
  string settings_json = 4;
  string if_match = 5;
}
message MemorySettingsResponse {
  reserved 100 to 199;
  string settings_json = 1;
}
message MemoryAccessRequest {
  reserved 100 to 199;
  string tenant_id = 1;
  string workspace_id = 2;
  string kind = 3;
}
message MemoryAccessResponse {
  reserved 100 to 199;
  bool allowed = 1;
  uint32 retention_days = 2;
}
message RecallChatRequest {
  reserved 100 to 199;
  string tenant_id = 1;
  string workspace_id = 2;
  string conversation_id = 3;
  string messages_json = 4;
}
message RecallWorkflowRequest {
  reserved 100 to 199;
  string tenant_id = 1;
  string workspace_id = 2;
  string workflow_id = 3;
}
message MemoryRecallResponse {
  reserved 100 to 199;
  string memory_json = 1;
}
