syntax = "proto3";

package alter.verify.v1;

service VerifyService {
  rpc ScoreGate(ScoreGateRequest) returns (ScoreGateResponse);
  rpc CheckHallucination(CheckHallucinationRequest) returns (CheckHallucinationResponse);
  rpc AssessSeverity(AssessSeverityRequest) returns (AssessSeverityResponse);
  // HARD-7: real target for eval-service's verification golden set. Unlike
  // ScoreGate (which reads real node output from the Blackboard via a real
  // run/node_execution context, still HEAL-2's disclosed follow-up), this
  // takes the node's output inline -- exactly what a golden-set eval case
  // already has, no fabricated run/node_execution context needed. Reuses
  // VerificationKernel.score_node() (HEAL-2, real, tested) as-is.
  rpc ScoreNodeInline(ScoreNodeInlineRequest) returns (ScoreNodeInlineResponse);
}

message ScoreGateRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string run_id = 2; // run_ prefixed UUIDv7
  string node_execution_id = 3; // node_ prefixed UUIDv7
  string gate_type = 4;
  repeated string evidence_artifact_ids = 5; // art_ prefixed UUIDv7 values
}

message ScoreGateResponse {
  reserved 100 to 199;

  string verification_result_id = 1; // ver_ prefixed UUIDv7
  string verdict = 2;
  double score = 3;
}

message CheckHallucinationRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string run_id = 2; // run_ prefixed UUIDv7
  string node_execution_id = 3; // node_ prefixed UUIDv7
  string response_artifact_id = 4 [deprecated = true]; // compatibility only; rejected by HEAL-3
  repeated string evidence_artifact_ids = 5 [deprecated = true]; // compatibility only
  string response_node_ref = 6; // compiled DAG node key / Blackboard output_ref
  repeated string evidence_node_refs = 7; // compiled DAG node keys / Blackboard input refs
}

message CheckHallucinationResponse {
  reserved 100 to 199;

  string verification_result_id = 1; // ver_ prefixed UUIDv7
  string verdict = 2;
  double confidence = 3;
}

message AssessSeverityRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string run_id = 2; // run_ prefixed UUIDv7
  string node_execution_id = 3; // node_ prefixed UUIDv7
  string finding_json = 4;
}

message AssessSeverityResponse {
  reserved 100 to 199;

  string severity = 1 [deprecated = true]; // compatibility mirror of severity_tier
  string rationale = 2;
  SafetySeverity severity_tier = 3;
}

enum SafetySeverity {
  SAFETY_SEVERITY_UNSPECIFIED = 0;
  SAFETY_SEVERITY_LOW = 1;
  SAFETY_SEVERITY_MEDIUM = 2;
  SAFETY_SEVERITY_HIGH = 3;
  SAFETY_SEVERITY_CRITICAL = 4;
}

message ScoreNodeInlineRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string run_id = 2; // run_ prefixed UUIDv7
  string node_execution_id = 3; // node_ prefixed UUIDv7
  string node_key = 4;
  string node_type = 5; // one of the 11 real NodeType values
  string config_json = 6;
  string output_json = 7;
  // C29: the producing node's success criteria. When present the reviewer
  // judges the output against each one and any unmet criterion fails.
  repeated string success_criteria = 8;
}

message ScoreNodeInlineResponse {
  reserved 100 to 199;

  string verdict = 1; // pass | warn | fail
  double score = 2;
  double threshold = 3;
  string reviewer_model = 4; // "deterministic" for structural checks, else the resolved ADVANCED capability
  string details_json = 5;
}
