syntax = "proto3";

package alter.cost.v1;

service CostService {
  rpc IngestCostEvent(IngestCostEventRequest) returns (IngestCostEventResponse);
  rpc QueryRollups(QueryRollupsRequest) returns (QueryRollupsResponse);
  rpc ResolveUnitPrice(ResolveUnitPriceRequest) returns (ResolveUnitPriceResponse);
  rpc RecordModelOutcome(RecordModelOutcomeRequest) returns (RecordModelOutcomeResponse);
  // Design log §21: credits are consumed only by runs that pass verification,
  // so the ledger records each run's verification verdict beside its cost.
  rpc RecordRunVerdict(RecordRunVerdictRequest) returns (RecordRunVerdictResponse);
}

message IngestCostEventRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string cost_event_id = 2; // cst_ prefixed UUIDv7
  string run_id = 3; // run_ prefixed UUIDv7
  string node_execution_id = 4; // node_ prefixed UUIDv7
  string provider_reference = 5; // opaque external reference
  string usage_json = 6;
  string amount_json = 7;
  string source = 8; // one of: model_gateway | tool_gateway | sandbox | storage | browser
  string occurred_at = 9; // ISO 8601 timestamp, set by the emitting service
}

message IngestCostEventResponse {
  reserved 100 to 199;

  bool accepted = 1;
}

message QueryRollupsRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string workspace_id = 2; // ws_ prefixed UUIDv7
  string start_at = 3; // ISO 8601 timestamp
  string end_at = 4; // ISO 8601 timestamp
  repeated string dimensions = 5;
  // Optional wf_/prj_ prefixed parent id. Empty means all parents.
  string parent_id = 6;
  // ISO 4217 currency. Empty preserves legacy USD rollup behavior.
  string currency = 7;
}

message QueryRollupsResponse {
  reserved 100 to 199;

  string rollups_json = 1;
}

message ResolveUnitPriceRequest {
  reserved 100 to 199;

  string provider = 1;
  string resource = 2;
  // The model the price is for. Empty asks for the provider-wide price, which
  // is all this request could express before #168; a model with no row of its
  // own falls back to that too.
  string model_id = 3;
}

message ResolveUnitPriceResponse {
  reserved 100 to 199;

  string unit_cost_minor = 1;
  string currency = 2;
  string confidence = 3; // "fixed_table" | "tenant_historical" | "global_historical" | "no_data"
}

message RecordModelOutcomeRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string provider = 2;
  string resource = 3;
  string verdict = 4; // success | failure | partial | escalated
  string run_id = 5; // run_ prefixed UUIDv7, empty if not applicable
  string node_execution_id = 6; // node_ prefixed UUIDv7, empty if not applicable
  string recorded_at = 7; // ISO 8601 timestamp, set by the emitting service
}

message RecordModelOutcomeResponse {
  reserved 100 to 199;

  bool accepted = 1;
}

message RecordRunVerdictRequest {
  reserved 100 to 199;

  string tenant_id = 1; // ten_ prefixed UUIDv7
  string run_id = 2; // run_ prefixed UUIDv7
  // The run's recorded outcome: completed_verified | rescued | escalated |
  // failed | abandoned | degraded (orchestration run_outcomes.verdict).
  string verdict = 3;
  string decided_at = 4; // ISO 8601 timestamp of the run's outcome decision
}

message RecordRunVerdictResponse {
  // False when this run's verdict was already recorded (idempotent replay).
  bool recorded = 1;
}
