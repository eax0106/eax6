# Single-EC2 MVP stack (task 6.1). Every application container uses the host's
# network, so the service addresses in the generated .env (127.0.0.1:<port>)
# are the same ones local development uses -- one set of addresses, not two.
# Only Caddy's 80/443 are reachable from outside; the security group opens
# nothing else. Data containers publish on loopback only.
#
# Started by bootstrap.sh, which writes .env next to this file first.
name: alter

x-node: &node
  image: ${ALTER_REGISTRY:-alter}/node:${ALTER_IMAGE_TAG:-dev}
  network_mode: host
  env_file: .env
  restart: unless-stopped
  depends_on:
    platform-db: { condition: service_healthy }
    engine-db: { condition: service_healthy }
    cost-db: { condition: service_healthy }
    redis: { condition: service_healthy }

x-python: &python
  network_mode: host
  env_file: .env
  restart: unless-stopped
  depends_on:
    engine-db: { condition: service_healthy }
    ads-db: { condition: service_healthy }

services:
  # --- data ------------------------------------------------------------------
  platform-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_api
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?generated by bootstrap.sh}
    ports: ["127.0.0.1:${PLATFORM_DB_PORT:-5432}:5432"]
    volumes: [platform-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U platform_api -d platform_db"], interval: 5s, retries: 30 }
    restart: unless-stopped

  engine-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${ENGINE_DB_ADMIN_PASSWORD:?generated by bootstrap.sh}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?generated by bootstrap.sh}
      INTELLIGENCE_DB_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?generated by bootstrap.sh}
      MEMORY_DB_PASSWORD: ${MEMORY_DB_PASSWORD:-}
    ports: ["127.0.0.1:${ENGINE_DB_PORT:-5433}:5432"]
    volumes:
      - engine-db:/var/lib/postgresql/data
      - ../../infrastructure/local/engine-db-init.sh:/docker-entrypoint-initdb.d/engine-db-init.sh:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 30 }
    restart: unless-stopped

  ads-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ads_db
      POSTGRES_USER: ads_core
      POSTGRES_PASSWORD: ${ADS_DB_PASSWORD:-ads_core_local}
    ports: ["127.0.0.1:${ADS_DB_PORT:-5434}:5432"]
    volumes:
      - ads-db:/var/lib/postgresql/data
      - ../../infrastructure/local/ads-db-init.sh:/docker-entrypoint-initdb.d/ads-db-init.sh:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ads_core -d ads_db"], interval: 5s, retries: 30 }
    restart: unless-stopped

  cost-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cost_db
      POSTGRES_USER: cost_ledger_service
      POSTGRES_PASSWORD: ${COST_DB_PASSWORD:?generated by bootstrap.sh}
    ports: ["127.0.0.1:${COST_DB_PORT:-5435}:5432"]
    volumes: [cost-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cost_ledger_service -d cost_db"], interval: 5s, retries: 30 }
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 30 }
    restart: unless-stopped

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.360
    ports: ["127.0.0.1:${PRESIDIO_ANALYZER_PORT:-5001}:3000"]
    restart: unless-stopped

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.360
    ports: ["127.0.0.1:${PRESIDIO_ANONYMIZER_PORT:-5002}:3000"]
    restart: unless-stopped

  # --- Node services (one image, service name as the argument) ---------------
  # Services that read AppConfig get scoped identifiers: the shared
  # .env holds one scoped set per service (see .env.local.example), mapped
  # here onto the unscoped names each service reads.
  audit-service: { <<: *node, command: ["audit-service"] }
  cost-ledger-service: { <<: *node, command: ["cost-ledger-service"] }
  model-gateway:
    <<: *node
    command: ["model-gateway"]
    environment:
      APPCONFIG_APPLICATION_ID: ${MODEL_GATEWAY_APPCONFIG_APPLICATION_ID:?}
      APPCONFIG_ENVIRONMENT_ID: ${MODEL_GATEWAY_APPCONFIG_ENVIRONMENT_ID:?}
      APPCONFIG_CONFIGURATION_PROFILE_ID: ${MODEL_GATEWAY_APPCONFIG_CONFIGURATION_PROFILE_ID:?}
  tool-gateway:
    <<: *node
    command: ["tool-gateway"]
    environment:
      APPCONFIG_APPLICATION_ID: ${TOOL_GATEWAY_APPCONFIG_APPLICATION_ID:?}
      APPCONFIG_ENVIRONMENT_ID: ${TOOL_GATEWAY_APPCONFIG_ENVIRONMENT_ID:?}
      APPCONFIG_CONFIGURATION_PROFILE_ID: ${TOOL_GATEWAY_APPCONFIG_CONFIGURATION_PROFILE_ID:?}
  sandbox-service:
    <<: *node
    command: ["sandbox-service"]
    environment:
      APPCONFIG_APPLICATION_ID: ${SANDBOX_SERVICE_APPCONFIG_APPLICATION_ID:?}
      APPCONFIG_ENVIRONMENT_ID: ${SANDBOX_SERVICE_APPCONFIG_ENVIRONMENT_ID:?}
      APPCONFIG_CONFIGURATION_PROFILE_ID: ${SANDBOX_SERVICE_APPCONFIG_CONFIGURATION_PROFILE_ID:?}
  provisioning-service: { <<: *node, command: ["provisioning-service"] }
  # Pre-run estimation reads the same model policy and token caps as the gateway.
  orchestration-service:
    <<: *node
    command: ["orchestration-service"]
    environment:
      APPCONFIG_APPLICATION_ID: ${MODEL_GATEWAY_APPCONFIG_APPLICATION_ID:?}
      APPCONFIG_ENVIRONMENT_ID: ${MODEL_GATEWAY_APPCONFIG_ENVIRONMENT_ID:?}
      APPCONFIG_CONFIGURATION_PROFILE_ID: ${MODEL_GATEWAY_APPCONFIG_CONFIGURATION_PROFILE_ID:?}
      COST_LEDGER_BASE_URL: http://127.0.0.1:${COST_PORT:-3022}
  background-workers: { <<: *node, command: ["background-workers"] }
  platform-api:
    <<: *node
    command: ["platform-api"]
    environment:
      # Plan definitions: the file shipped in the image, overridden per plan
      # from platform_db by staff (admin policy routes). No AppConfig
      # application exists for platform-api (task 6.1d).
      ALTER_CONFIG_SOURCE: local-file
      # platform-api resolves secret references as environment variable names;
      # tool-gateway resolves the same variable in Secrets Manager.
      SES_CREDENTIALS_SECRET_REF: env:SES_CREDENTIALS_JSON
      PLATFORM_RETENTION_DATABASE_URL: ${PLATFORM_RETENTION_DATABASE_URL:?}

  # --- Python services -------------------------------------------------------
  ads-core:
    <<: *python
    image: ${ALTER_REGISTRY:-alter}/ads-core:${ALTER_IMAGE_TAG:-dev}
    command: ["uvicorn", "src.main:app", "--host", "127.0.0.1", "--port", "${ADS_CORE_PORT:-8010}"]
  intelligence-service:
    <<: *python
    image: ${ALTER_REGISTRY:-alter}/intelligence-service:${ALTER_IMAGE_TAG:-dev}
    command: ["uvicorn", "src.main:app", "--host", "127.0.0.1", "--port", "${INTELLIGENCE_SERVICE_PORT:-8000}"]
  verification-service:
    <<: *python
    image: ${ALTER_REGISTRY:-alter}/verification-service:${ALTER_IMAGE_TAG:-dev}
    command: ["uvicorn", "src.main:app", "--host", "127.0.0.1", "--port", "${VERIFICATION_SERVICE_PORT:-8001}"]
  verification-grpc:
    <<: *python
    image: ${ALTER_REGISTRY:-alter}/verification-service:${ALTER_IMAGE_TAG:-dev}
    command: ["python", "-m", "src.grpc_server"]
  memory-service:
    <<: *python
    image: ${ALTER_REGISTRY:-alter}/memory-service:${ALTER_IMAGE_TAG:-dev}
    command: ["uvicorn", "src.main:app", "--host", "127.0.0.1", "--port", "${MEMORY_SERVICE_PORT:-8002}"]
  memory-grpc:
    <<: *python
    image: ${ALTER_REGISTRY:-alter}/memory-service:${ALTER_IMAGE_TAG:-dev}
    command: ["python", "-m", "src.grpc_server"]
  eval-service:
    <<: *python
    image: ${ALTER_REGISTRY:-alter}/eval-service:${ALTER_IMAGE_TAG:-dev}
    command: ["uvicorn", "src.main:app", "--host", "127.0.0.1", "--port", "${EVAL_SERVICE_PORT:-8003}"]
  eval-grpc:
    <<: *python
    image: ${ALTER_REGISTRY:-alter}/eval-service:${ALTER_IMAGE_TAG:-dev}
    command: ["python", "-m", "src.grpc_server"]

  # --- Edge: TLS and the web bundle -------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    network_mode: host
    environment:
      ALTER_DOMAIN: ${ALTER_DOMAIN:?set ALTER_DOMAIN in operator.env}
      PLATFORM_API_PORT: ${PLATFORM_API_PORT:-3020}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  platform-db:
  engine-db:
  ads-db:
  cost-db:
  caddy-data:
